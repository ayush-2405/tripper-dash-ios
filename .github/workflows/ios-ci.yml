name: iOS Swift Package and App CI

on:
  push:
    branches:
      - main
      - ios/dash-auth-network
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS app project
        run: xcodegen generate

      - name: Build iOS app for Simulator
        run: xcodebuild -project TripperDash.xcodeproj -scheme TripperDash -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
