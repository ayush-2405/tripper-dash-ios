name: iOS Swift Package CI

on:
  push:
    branches:
      - main
      - ios/dash-auth-network
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build for iOS Simulator
        run: xcodebuild -scheme TripperDashCore -destination 'generic/platform=iOS Simulator' build
